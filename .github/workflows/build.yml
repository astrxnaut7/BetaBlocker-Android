name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Remove invalid dependency
        shell: bash
        run: |
          for file in app/build.gradle.kts app/build.gradle; do
            if [ -f "$file" ]; then
              sed -i '/androidx\.accessibilityservice:accessibilityservice/d' "$file"
            fi
          done

      - name: Create placeholder icons
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap
          for icon in ic_launcher ic_launcher_round; do
            file="app/src/main/res/mipmap/${icon}.xml"
            if [ ! -f "$file" ]; then
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">' \
                '<path android:fillColor="#263238" android:pathData="M0,0h48v48h-48z"/>' \
                '<path android:fillColor="#FFFFFF" android:pathData="M12,21h24v6h-24z"/>' \
                '</vector>' > "$file"
            fi
          done

      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaBlocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


          
