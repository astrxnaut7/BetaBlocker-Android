name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Configure memory and fix project
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          properties = {
              "org.gradle.jvmargs": "-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8",
              "org.gradle.workers.max": "2",
              "org.gradle.parallel": "false",
              "kotlin.compiler.execution.strategy": "in-process",
              "android.useAndroidX": "true",
          }
          path = Path("gradle.properties")
          lines = path.read_text().splitlines() if path.exists() else []
          lines = [
              line for line in lines
              if line.strip().split("=", 1)[0].strip() not in properties
          ]
          lines.extend(f"{key}={value}" for key, value in properties.items())
          path.write_text("\n".join(lines) + "\n")

          build = Path("app/build.gradle.kts")
          text = build.read_text()
          text = "\n".join(
              line for line in text.splitlines()
              if "androidx.accessibilityservice:accessibilityservice" not in line
          )
          text += "\n\ndependencies {\n"
          text += '    implementation("androidx.compose.material:material-icons-extended:1.5.0")\n'
          text += "}\n"
          text += "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n"
          text += "    kotlinOptions {\n"
          text += "        freeCompilerArgs += listOf(\n"
          text += '            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",\n'
