name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Fix project resources and dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dependency = "androidx.accessibilityservice:accessibilityservice"
          for name in ("app/build.gradle.kts", "app/build.gradle"):
              path = Path(name)
              if path.exists():
                  lines = path.read_text().splitlines(keepends=True)
                  path.write_text("".join(
                      line for line in lines if dependency not in line
                  ))

          icons = Path("app/src/main/res/mipmap")
          icons.mkdir(parents=True, exist_ok=True)

          icon = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#263238"
                  android:pathData="M0,0h48v48h-48z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,21h24v6h-24z" />
          </vector>
          """

          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = icons / name
              if not path.exists():
                  path.write_text(icon)
          PY

      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true :app:assembleDebug --stacktrace

      - name: Up
